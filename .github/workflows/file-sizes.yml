# Cheap frontend-only ratchet. Does not run on server-only PRs.
name: File sizes

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "src/**"
      - "scripts/check-file-sizes.ts"
      - ".github/workflows/file-sizes.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/check-file-sizes.ts"
      - ".github/workflows/file-sizes.yml"

permissions:
  contents: read

jobs:
  check:
    # Same Cyclone / mq-live gate as CI. See .github/workflows/ci.yml.
    if: >
      github.event_name == 'push' ||
      github.triggering_actor != 'mergestorm-cyclone[bot]' ||
      contains(github.event.pull_request.labels.*.name, 'mq-live')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --experimental-strip-types scripts/check-file-sizes.ts
