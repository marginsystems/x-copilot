# Cheap line-count ratchet over src, server, and the sidecars.
name: File sizes

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "src/**"
      - "server/src/**"
      - "webhook/src/**"
      - "analytics/src/**"
      - "scripts/check-file-sizes.ts"
      - ".github/workflows/file-sizes.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "server/src/**"
      - "webhook/src/**"
      - "analytics/src/**"
      - "scripts/check-file-sizes.ts"
      - ".github/workflows/file-sizes.yml"

permissions:
  contents: read

jobs:
  check:
    # Same as CI: never skip Cyclone. Only [skip ci] on the commit.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --experimental-strip-types scripts/check-file-sizes.ts
