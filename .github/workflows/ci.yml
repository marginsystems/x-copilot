# Unit + mounted tests, typecheck, and Vite build. No live probes.
# Omit optional @xenova/transformers — CI never loads MiniLM. That package
# was 6 of the 7 minutes on npm ci.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # Always run, including Cyclone restacks. The merge queue needs a real
    # check on every published head. The only skip is GitHub's commit tag:
    # [skip ci] / [ci skip] / [no ci].
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # Omit MiniLM. Do not `npm install --package-lock=false` at the root —
      # that rewrites the tree and drops tsx's esbuild binary. Unpack each
      # native package next to the host that needs it.
      - run: npm ci --omit=optional --no-audit --no-fund
      - run: |
          set -euo pipefail
          unpack() {
            local spec=$1 dest=$2
            local tgz
            tgz=$(npm pack "$spec" --pack-destination /tmp | tail -n1)
            rm -rf "$dest"
            mkdir -p "$dest"
            tar -xzf "/tmp/$tgz" -C "$dest" --strip-components=1
          }
          unpack @rollup/rollup-linux-x64-gnu@4.62.2 node_modules/@rollup/rollup-linux-x64-gnu
          unpack "@esbuild/linux-x64@$(node -p "require('./node_modules/esbuild/package.json').version")" \
            node_modules/esbuild/node_modules/@esbuild/linux-x64
          if [ -f node_modules/tsx/node_modules/esbuild/package.json ]; then
            unpack "@esbuild/linux-x64@$(node -p "require('./node_modules/tsx/node_modules/esbuild/package.json').version")" \
              node_modules/tsx/node_modules/@esbuild/linux-x64
          fi
      - name: List unit tests
        run: npm run test:unit:list
      - name: Run unit tests
        run: npm run test:unit
      - name: List mounted tests
        run: npm run test:mounted:list
      - name: Run mounted tests
        run: npm run test:mounted
      - name: Report hook dependency backlog
        run: npm run lint:hooks
      - run: npm run build
