# Unit tests + typecheck + Vite build. No live X / Stripe / search probes.
# Omit optional @xenova/transformers — CI never loads MiniLM. That package
# was 6 of the 7 minutes on npm ci.
name: CI

on:
  pull_request:
    # opened / synchronize / reopened only. Do not listen for `labeled`:
    # mq-live is a flag, not a start button. The restack synchronize is
    # the one CI run (same as MergeStorm).
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # Skip Cyclone review follow-ups on a PR (bill $0 — job never starts).
    # github.triggering_actor, not actor: a human "Re-run all jobs" still runs.
    # Never gate main-push CI on actor — that is the merge-safety backstop.
    # mq-live: run even when Cyclone restacks. Unlabeled Cyclone pushes skip.
    if: >
      github.event_name == 'push' ||
      github.triggering_actor != 'mergestorm-cyclone[bot]' ||
      contains(github.event.pull_request.labels.*.name, 'mq-live')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # Omit MiniLM. Do not `npm install --package-lock=false` at the root —
      # that rewrites the tree and drops tsx's esbuild binary. Unpack each
      # native package next to the host that needs it.
      - run: npm ci --omit=optional --no-audit --no-fund
      - run: |
          set -euo pipefail
          unpack() {
            local spec=$1 dest=$2
            local tgz
            tgz=$(npm pack "$spec" --pack-destination /tmp | tail -n1)
            rm -rf "$dest"
            mkdir -p "$dest"
            tar -xzf "/tmp/$tgz" -C "$dest" --strip-components=1
          }
          unpack @rollup/rollup-linux-x64-gnu@4.62.2 node_modules/@rollup/rollup-linux-x64-gnu
          unpack "@esbuild/linux-x64@$(node -p "require('./node_modules/esbuild/package.json').version")" \
            node_modules/esbuild/node_modules/@esbuild/linux-x64
          if [ -f node_modules/tsx/node_modules/esbuild/package.json ]; then
            unpack "@esbuild/linux-x64@$(node -p "require('./node_modules/tsx/node_modules/esbuild/package.json').version")" \
              node_modules/tsx/node_modules/@esbuild/linux-x64
          fi
      - run: npm test
      - run: npm run build
