# Unit tests + typecheck + Vite build. No live X / Stripe / search probes.
# Omit optional @xenova/transformers — CI never loads MiniLM. That package
# was 6 of the 7 minutes on npm ci.
name: CI

on:
  pull_request:
    # opened / synchronize / reopened only. Do not listen for `labeled`:
    # mq-live is a flag, not a start button. The restack synchronize is
    # the one CI run (same as MergeStorm).
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # Skip Cyclone review follow-ups on a PR (bill $0 — job never starts).
    # github.triggering_actor, not actor: a human "Re-run all jobs" still runs.
    # Never gate main-push CI on actor — that is the merge-safety backstop.
    # mq-live: run even when Cyclone restacks. Unlabeled Cyclone pushes skip.
    if: >
      github.event_name == 'push' ||
      github.triggering_actor != 'mergestorm-cyclone[bot]' ||
      contains(github.event.pull_request.labels.*.name, 'mq-live')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --omit=optional --no-audit --no-fund
      - run: npm install --no-save --package-lock=false --ignore-scripts --omit=optional @esbuild/linux-x64@0.21.5 @rollup/rollup-linux-x64-gnu@4.62.2
      - run: npm test
      - run: npm run build
