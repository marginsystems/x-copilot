# Static Vite SPA on xcopilot.dev — no Worker secrets (API is api.xcopilot.dev).
# workers_dev stays off: the *.workers.dev URL is not in the API's CORS
# allowlist (ALLOWED_ORIGINS), so the SPA would be CORS-blocked there. Serve via
# the xcopilot.dev custom domain (attach in the CF dashboard after deploy).
name = "x-copilot"
compatibility_date = "2026-08-01"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
